# Config seed, applied by the app at every start (CONFIG_SEED_PATH in docker-compose.yml).
# It registers the rte container as the default runner, so playbook forms run there, signing in
# with the credential below. The app dials the RTE (RTE_MODE=inbound) over one WebSocket: the RTE
# holds no database credentials. Objects declared here are read-only in the interface; see
# https://ansibleforms.com/seed.
version: 1
credentials:
  items:
    - name: rte
      credential_type: rte
      description: The RTE_TOKEN of the rte container of docker-compose.yml, and its address
      url: http://rte:8000
      password: ${RTE_TOKEN}
runners:
  items:
    - name: rte
      type: rte
      rte_mode: inbound
      description: The rte container of docker-compose.yml
      credential: rte
      is_default: true
