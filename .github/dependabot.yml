version: 2

# Keeps the images in docker-compose.yml and the workflow actions up to date, on main
# (AnsibleForms 7) and on the v6 branch (AnsibleForms 6). Updates are never grouped : every image gets its own pull
# request, so each one can be reviewed and reverted on its own.
#
# Image major versions are proposed too, each read before merging: a new AnsibleForms major
# may need its own branch setup, and a MySQL major (8.4 LTS to 9.x) is a database upgrade
# to plan before its pull request is merged.

updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    target-branch: v6
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  # Action majors are taken : CI starts the whole stack on every pull request, so a
  # breaking action fails there before it merges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /
    target-branch: v6
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
