version: 2

# Every pending update gets its pull request at once (open-pull-requests-limit: 100 on each
# entry, as Dependabot has no unlimited value), instead of five at a time per entry.

# Keeps the images in docker-compose.yml and the workflow actions up to date, on main
# (AnsibleForms 7) and on the v6 branch (AnsibleForms 6). Updates are never grouped : every image gets its own pull
# request, so each one can be reviewed and reverted on its own.
#
# Image major versions are proposed too, each read before merging, but for two : MySQL stays
# on its LTS line (patches only, the next LTS taken by hand) and the v6 branch keeps
# AnsibleForms 6.

updates:
  - package-ecosystem: docker-compose
    open-pull-requests-limit: 100
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # MySQL stays on its LTS line (9.7) : its patches only. Dependabot cannot tell an LTS
      # release from an innovation one, so moving to the next LTS is done by hand
      - dependency-name: 'mysql'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker-compose

    open-pull-requests-limit: 100
    directory: /
    target-branch: v6
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # the v6 branch runs AnsibleForms 6 : never its next major
    ignore:
      - dependency-name: 'ansibleforms/ansibleforms'
        update-types: ['version-update:semver-major']
      # MySQL stays on its LTS line (8.4 on v6) : its patches only. Dependabot cannot tell an
      # LTS release from an innovation one, so moving to the next LTS is done by hand
      - dependency-name: 'mysql'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Action majors are taken : CI starts the whole stack on every pull request, so a
  # breaking action fails there before it merges.
  - package-ecosystem: github-actions
    open-pull-requests-limit: 100
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions

    open-pull-requests-limit: 100
    directory: /
    target-branch: v6
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
